name: Шаблон отчета о дефекте
description: Используйте этот шаблон для сообщения о найденных ошибках
title: "[Ошибка]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Пожалуйста, заполните форму ниже для регистрации дефекта.
  - type: checkboxes
    id: check_duplicate
    attributes:
      label: Проверка дубликатов
      description: Подтвердите, что такой ошибки еще нет в списке
      options:
        - label: Я подтверждаю, что ознакомился с существующими отчетами
    validations:
      required: true
  - type: textarea
    id: field_title
    attributes:
      label: Заголовок
      description: Укажите краткое название дефекта
      placeholder: Например, Падение программы при сохранении пустого ответа
    validations:
      required: true
  - type: textarea
    id: field_description
    attributes:
      label: Описание
      description: Кратко опишите суть найденной ошибки
      placeholder: Опишите, в чем заключается баг
    validations:
      required: true
  - type: textarea
    id: field_preconditions
    attributes:
      label: Предусловия
      description: Укажите условия перед началом теста
      placeholder: Программа PsychoTestProject.exe запущена
    validations:
      required: true
  - type: textarea
    id: field_steps
    attributes:
      label: Шаги воспроизведения
      description: Пошагово опишите, как вызвать ошибку
      placeholder: 1. Открыть... 2. Нажать...
    validations:
      required: true
  - type: textarea
    id: field_expected
    attributes:
      label: Ожидаемый результат
      description: Что должно было произойти при правильной работе
      placeholder: Появится предупреждение об ошибке ввода
    validations:
      required: true
  - type: textarea
    id: field_actual
    attributes:
      label: Фактический результат
      description: Что произошло в программе на самом деле
      placeholder: Приложение аварийно закрылось
    validations:
      required: true
  - type: textarea
    id: field_attachments
    attributes:
      label: Скриншоты / Доп. материалы
      description: Добавьте ссылки на скриншоты при наличии
      placeholder: Вставьте ссылку или поставьте прочерк
    validations:
      required: true
  - type: dropdown
    id: field_priority
    attributes:
      label: Приоритет
      description: Срочность исправления
      options:
        - Низкий (Low)
        - Средний (Medium)
        - Высокий (High)
        - Критический (Urgent)
    validations:
      required: true
  - type: dropdown
    id: field_severity
    attributes:
      label: Серьезность
      description: Влияние бага на работу приложения
      options:
        - Незначительная (Minor)
        - Значительная (Major)
        - Критическая (Critical)
        - Блокирующая (Blocker)
    validations:
      required: true
