name: Отчет о дефекте PsychoTest
description: Создать отчет о найденной ошибке в программе тестирования
title: "[Ошибка] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Пожалуйста заполните форму ниже для регистрации найденного бага

  - type: checkboxes
    id: check_existing
    attributes:
      label: Проверка дубликатов
      description: Перед отправкой убедитесь что проверили похожие отчеты
      options:
        - label: Я подтверждаю что это уникальный дефект
    validations:
      required: true

  - type: textarea
    id: ticket_title
    attributes:
      label: Заголовок
      description: Краткое название ошибки
      placeholder: Падение программы при сохранении
    validations:
      required: true

  - type: textarea
    id: ticket_description
    attributes:
      label: Описание
      description: Подробное описание сути бага
      placeholder: В программе обнаружена проблема с сохранением данных
    validations:
      required: true

  - type: textarea
    id: ticket_preconditions
    attributes:
      label: Предусловия
      description: Что должно быть открыто или настроено перед тестом
      placeholder: Запущено приложение PsychoTestProject.exe
    validations:
      required: true

  - type: textarea
    id: ticket_steps
    attributes:
      label: Шаги воспроизведения
      description: Пошаговый алгоритм как вызвать ошибку
      placeholder: 1 Открыть приложение 2 Нажать кнопку
    validations:
      required: true

  - type: textarea
    id: ticket_expected
    attributes:
      label: Ожидаемый результат
      description: Как программа должна работать правильно
      placeholder: Программа выдает предупреждение
    validations:
      required: true

  - type: textarea
    id: ticket_actual
    attributes:
      label: Фактический результат
      description: Что произошло на самом деле
      placeholder: Приложение аварийно закрывается
    validations:
      required: true

  - type: textarea
    id: ticket_attachments
    attributes:
      label: Скриншоты или Доп материалы
      description: Ссылки или изображения дефекта
      placeholder: Добавьте файлы сюда или поставьте прочерк
    validations:
      required: true

  - type: dropdown
    id: ticket_priority
    attributes:
      label: Приоритет
      description: Насколько срочно нужно исправить
      options:
        - Низкий
        - Средний
        - Высокий
        - Критический
    validations:
      required: true

  - type: dropdown
    id: ticket_severity
    attributes:
      label: Серьезность
      description: Степень влияния на работу системы
      options:
        - Незначительная
        - Значительная
        - Критическая
        - Блокирующая
    validations:
      required: true
